[platformio]
default_envs = nucleo_f756zg

[env:nucleo_f767zi]
platform = ststm32
board = nucleo_f767zi
framework = arduino
build_type = debug
lib_deps = 
	stm32duino/STM32duino LwIP@^2.1.3
	stm32duino/STM32Ethernet@^1.4.0
	adafruit/Adafruit INA219@^1.2.3

[env:nucleo_f756zg]
platform = ststm32
board = nucleo_f756zg
framework = arduino
build_type = debug
lib_deps = 
